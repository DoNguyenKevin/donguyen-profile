<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haikyuu!! Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      color: #fff;
    }
    .container {
      width: 100%; max-width: 480px; height: 100vh; max-height: 800px;
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      border: 1px solid #ff6b0033;
      box-shadow: 0 0 60px #ff6b0011, inset 0 0 80px #ff6b0005;
      position: relative; overflow: hidden;
    }
    /* Volleyball pattern overlay */
    .container::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,107,0,.03) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(255,200,0,.02) 0%, transparent 50%);
      pointer-events: none;
    }
    .header {
      background: linear-gradient(135deg, #ff6b00, #ff8c00);
      padding: 16px 20px; text-align: center; position: relative; z-index: 1;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 1.2rem; letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,.3);
    }
    .header p { font-size: .75rem; opacity: .8; margin-top: 2px; }
    .chat {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
      gap: 12px; position: relative; z-index: 1;
    }
    .chat::-webkit-scrollbar { width: 4px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: #ff6b0044; border-radius: 4px; }
    .msg {
      max-width: 85%; padding: 12px 16px; border-radius: 14px;
      font-size: .9rem; line-height: 1.5; animation: fadeIn .2s ease;
      word-wrap: break-word;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .user {
      align-self: flex-end; background: #ff6b00; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start; background: #1e1e32; color: #ddd;
      border-bottom-left-radius: 4px; border: 1px solid #333;
    }
    .bot .name {
      font-size: .7rem; color: #ff8c00; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 4px;
    }
    .bot.thinking .name::after {
      content: ' typing...'; color: #666; font-weight: 400;
    }
    .bot.thinking .text::after { content: '▊'; animation: blink .8s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .input-area {
      padding: 12px 16px 16px; display: flex; gap: 8px;
      border-top: 1px solid #222; position: relative; z-index: 1; flex-shrink: 0;
    }
    .input-area input {
      flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #333;
      background: #1a1a2e; color: #fff; font-size: .9rem; outline: none;
      transition: border .2s;
    }
    .input-area input:focus { border-color: #ff6b00; }
    .input-area input::placeholder { color: #555; }
    .input-area button {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #ff6b00, #ff8c00); color: #fff;
      font-size: 1.1rem; cursor: pointer; transition: transform .15s;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .input-area button:active { transform: scale(.9); }
    .input-area button:disabled { opacity: .4; cursor: not-allowed; }
    .welcome {
      text-align: center; color: #666; margin: auto; font-size: .85rem;
      line-height: 1.8;
    }
    .welcome .icon { font-size: 3rem; margin-bottom: 8px; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏐 Haikyuu!! Chatbot</h1>
      <p>Ask me anything about the anime</p>
    </div>
    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <span class="icon">🏐</span>
        Ask me about Hinata, Kageyama, Karasuno,<br>
        any match, technique, or character!
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Ask about Haikyuu..." autofocus>
      <button id="send" onclick="send()">➤</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const welcome = document.getElementById('welcome');

    let messages = [];

    function addMessage(role, text) {
      welcome?.remove();
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'bot') {
        div.innerHTML = `<div class="name">🏐 Haikyuu Bot</div><div class="text">${text}</div>`;
      } else {
        div.textContent = text;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      sendBtn.disabled = true;
      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      const botDiv = addMessage('bot', '');
      botDiv.classList.add('thinking');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });

        if (!res.ok) {
          const err = await res.text();
          botDiv.classList.remove('thinking');
          botDiv.querySelector('.text').textContent = `Error: ${res.status} ${err.slice(0,100)}`;
          return;
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || 'No response';
        botDiv.classList.remove('thinking');
        botDiv.querySelector('.text').textContent = reply;
        messages.push({ role: 'assistant', content: reply });
      } catch (e) {
        botDiv.classList.remove('thinking');
        botDiv.querySelector('.text').textContent = `Error: ${e.message}`;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
